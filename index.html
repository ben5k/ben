<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070912;
  --bg2:#0d1226;
  --panel:#111830;
  --blue:#3aa0ff;
  --blue2:#8ec9ff;
  --yellow:#ffd23f;
  --ink:#eaf2ff;
  --ink-dim:#93a4c2;
  color-scheme: dark;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1px 1px at 10% 15%, #fff8 50%, transparent 50%),
    radial-gradient(1px 1px at 80% 10%, #fff6 50%, transparent 50%),
    radial-gradient(1px 1px at 60% 30%, #fff5 50%, transparent 50%),
    radial-gradient(1px 1px at 25% 45%, #fff6 50%, transparent 50%),
    radial-gradient(1px 1px at 90% 60%, #fff5 50%, transparent 50%),
    radial-gradient(1px 1px at 40% 80%, #fff6 50%, transparent 50%),
    radial-gradient(ellipse 100% 60% at 50% 0%, #1a2550 0%, var(--bg) 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Tajawal', sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}

.wrap{ max-width:560px; margin:0 auto; padding:0 20px 36px; }

/* ---- hero / orbit ---- */
.hero{
  position:relative;
  padding:38px 0 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.orbit{
  position:relative;
  width:232px; height:232px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; animation: fadeIn .8s ease forwards;
}
@keyframes fadeIn{ to{opacity:1;} }

.ring{
  position:absolute; inset:0;
  border-radius:50%;
  border:1.5px solid rgba(58,160,255,.35);
}
.ring.r2{ transform: rotate(35deg) scaleY(.62); border-color:rgba(255,210,63,.3); }
.ring.r3{ transform: rotate(-30deg) scaleY(.62); border-color:rgba(58,160,255,.25); }

.gem{ position:absolute; width:10px; height:10px; clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.gem.g1{ top:6px; left:30px; background:var(--yellow); transform:rotate(15deg); }
.gem.g2{ bottom:14px; right:10px; background:var(--blue); transform:rotate(-10deg); width:14px; height:14px;}
.gem.g3{ top:40%; right:-4px; background:#fff; opacity:.8; }

.avatar{
  position:relative;
  width:150px; height:150px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(58,160,255,.5);
  box-shadow: 0 0 40px rgba(58,160,255,.25);
  background:#000;
}
.avatar img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }

.badge{
  margin-top:20px;
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 18px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid rgba(58,160,255,.25);
  font-size:13px; font-weight:500;
  color:var(--blue2);
  opacity:0; animation: riseIn .7s ease .3s forwards;
}
.badge .dot{ width:6px; height:6px; border-radius:50%; background:#3ddc84; box-shadow:0 0 6px #3ddc84; }

@keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.title{
  margin-top:16px;
  font-family:'Rajdhani', sans-serif;
  font-weight:700;
  font-size:58px;
  letter-spacing:1px;
  line-height:1;
  background: linear-gradient(135deg, #ffffff 0%, var(--blue2) 55%, var(--blue) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  opacity:0; animation: riseIn .7s ease .42s forwards;
}

.tagpill{
  margin-top:16px;
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(255,210,63,.4);
  color:var(--yellow);
  font-size:13px; font-weight:500;
  opacity:0; animation: riseIn .7s ease .5s forwards;
}

.bio{
  margin-top:14px;
  font-size:13.5px;
  line-height:1.9;
  color:var(--ink-dim);
  max-width:360px;
  opacity:0; animation: riseIn .7s ease .56s forwards;
}

.cta{
  margin-top:22px;
  width:100%;
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:16px 20px;
  border-radius:16px;
  background: linear-gradient(135deg, var(--blue) 0%, #6f7bff 100%);
  color:#06101f;
  font-family:'Rajdhani', sans-serif;
  font-weight:700;
  font-size:17px;
  text-decoration:none;
  box-shadow: 0 10px 30px -8px rgba(58,160,255,.5);
  opacity:0; animation: riseIn .7s ease .62s forwards;
}
.cta svg{ width:18px; height:18px; fill:#06101f; }

/* ---- links grid ---- */
.section-label{
  margin-top:34px;
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
  font-family:'Rajdhani', sans-serif;
  font-weight:700;
  font-size:15px;
  color:var(--ink);
}
.section-label .ring-ico{
  width:16px; height:16px;
  border-radius:50%;
  border:2px solid var(--blue);
  flex-shrink:0;
}
.section-label .line{ flex:1; height:1px; background:linear-gradient(90deg, rgba(58,160,255,.4), transparent); }

.grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
}

.card{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:20px 8px 16px;
  background: linear-gradient(180deg, var(--panel) 0%, #0d1226 100%);
  border:1px solid rgba(58,160,255,.18);
  border-radius:18px;
  text-decoration:none;
  color:var(--ink);
  overflow:hidden;
  transition: transform .15s ease, border-color .2s ease;
}
.card:active{ transform:scale(.97); }
.card::after{
  content:"";
  position:absolute; left:14px; right:14px; bottom:0;
  height:2px;
  border-radius:2px;
}
.card.c1::after{ background:linear-gradient(90deg, var(--blue), transparent); }
.card.c2::after{ background:linear-gradient(90deg, var(--yellow), transparent); }
.card.c3::after{ background:linear-gradient(90deg, #ff5b5b, transparent); }
.card.c4::after{ background:linear-gradient(90deg, var(--yellow), var(--blue)); }
.card.c5::after{ background:linear-gradient(90deg, var(--blue), #6f7bff); }

.card .ic{ width:26px; height:26px; }
.card .ic svg{ width:100%; height:100%; }
.card .lbl{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:14.5px; }

.c1 .ic svg{ fill:#8ea1ff; }
.c2 .ic svg{ fill:var(--blue2); }
.c3 .ic svg{ fill:#ff7b7b; }
.c4 .ic svg{ fill:var(--yellow); }
.c5 .ic svg{ fill:var(--blue2); }

footer{ text-align:center; padding:30px 0 6px; color:var(--ink-dim); font-size:11px; }

@media (prefers-reduced-motion: reduce){
  .orbit,.badge,.title,.tagpill,.bio,.cta{ animation:none; opacity:1; }
}
</style>
</head>
