
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100506">
<title>Ben — Leader | Official Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050303;
  color: #fff0d5;
  font-family: 'Cairo', sans-serif;
  padding: 22px 14px;
}

.page {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 24px 22px;
  border: 1px solid #55272d;
  border-radius: 30px;
  background: linear-gradient(160deg, #130708, #0b0405 70%);
  box-shadow: 0 0 30px #5a10151c;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  direction: ltr;
  padding-bottom: 24px;
  border-bottom: 1px solid #6a3036;
  color: #c4b2b1;
  font-size: 14px;
  font-weight: 700;
}

.brand {
  color: #e9c98b;
  font-size: 30px;
  font-weight: 900;
}

.profile {
  text-align: center;
  padding-top: 36px;
}

.hero-image {
  width: 100%;
  max-width: 460px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center;
  display: block;
  margin: 0 auto 12px;
  border-radius: 26px;
  border: 1px solid #4e2529;
  box-shadow: 0 0 24px #a51e3020;
}

.name {
  direction: ltr;
  font-size: 42px;
  font-weight: 900;
  line-height: 1.2;
  margin: 12px 0 0;
}

.role {
  direction: ltr;
  color: #e8c68b;
  letter-spacing: 5px;
  font-size: 20px;
  font-weight: 800;
  margin-top: 8px;
}

.description {
  color: #c9b9b8;
  font-size: 22px;
  font-weight: 700;
  margin: 18px 0 10px;
}

.subtitle {
  direction: ltr;
  color: #e8c68b;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 24px;
}

.socials {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  direction: ltr;
}

.social-card {
  min-height: 150px;
  padding: 18px;
  text-decoration: none;
  color: #fff0d5;
  border: 1px solid #a8794a;
  border-radius: 17px;
  background: #210a0e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform .2s, background .2s;
}

.social-card:hover {
  transform: translateY(-3px);
  background: #351017;
}

.social-icon {
  align-self: flex-end;
  color: #e8c68b;
  width: 34px;
  height: 34px;
}

.social-title {
  font-size: 24px;
  font-weight: 900;
}

.open-link {
  direction: rtl;
  text-align: right;
  font-size: 15px;
  color: #c9b9b8;
  font-weight: 700;
}

.footer {
  margin-top: 26px;
  text-align: center;
  color: #d9b985;
  font-weight: 800;
  font-size: 15px;
  direction: ltr;
}

@media (max-width: 380px) {
  .page {
    padding: 18px 14px;
  }

  .social-card {
    min-height: 132px;
    padding: 13px;
  }

  .social-title {
    font-size: 20px;
  }

  .description {
    font-size: 19px;
  }
}
</style>
</head>

<body>
<main class="page">

  <header class="topbar">
    <span>OFFICIAL PAGE</span>
    <span class="brand">♛ BEN</span>
  </header>

  <section class="profile">
    <img
      class="hero-image"
      src="https://g.top4top.io/p_3937nge9b0.png"
      alt="Ben anime character"
      onerror="this.alt='تعذر تحميل الصورة';"
    >

    <h1 class="name">Ben</h1>
    <div class="role">— LEADER —</div>

    <p class="description">كل الروابط في مكان واحد</p>
    <div class="subtitle">ROBLOX SCRIPTS &amp; HACKS</div>
  </section>

  <section class="socials">

    <a class="social-card"
       href="https://t.me/Ben_5k"
       target="_blank" rel="noopener noreferrer">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/>
        <path d="m22 2-7 20-4-9-9-4Z"/>

    <a class="social-card"

      <svg class="social-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8Z"/>
      </svg>
      <span class="social-title">Discord</span>
      <span class="open-link">افتح الرابط ←</span>
    </a>

    <a class="social-card"
       href="https://www.tiktok.com/@bir.y5?_r=1&_t=ZS-9AUi3dOIGbE"
       target="_blank" rel="noopener noreferrer">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <span class="social-title">TikTok</span>
      <span class="open-link">افتح الرابط ←</span>
    </a>

    <a class="social-card"
       href="https://youtube.com/@gqj2?si=1lmPmFBFqfV7-V_q"
       target="_blank" rel="noopener noreferrer">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="4"/>
        <path d="m10 9 5 3-5 3Z"/>
      </svg>
      <span class="social-title">YouTube</span>
      <span class="open-link">افتح الرابط ←</span>
    </a>

  </section>

  <footer class="footer">♛ BEN — LEADER ♛</footer>

</main>
</body>
</html>
