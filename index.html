.banner{width:100%;display:block;aspect-ratio:1.7;object-fit:cover}

.ico{font-size:32px;color:#e9c58a;display:block;margin-bottom:20px}
.link b{font-size:22px;direction:ltr;display:block;text-align:left}
.link small{display:block;color:#c6b8b8;margin-top:16px;font-size:15px}
footer{text-align:center;color:#b9a5a5;margin:30px 0 10px;font-size:13px}
@media(max-width:380px){

<script>
(async()=>{
 const counter=document.getElementById("visits");
 try{
  const response=await fetch(
   "https://api.counterapi.dev/v1/t7b7-on-top-public/visits/up"
  );
  if(!response.ok) throw Error();
  const data=await response.json();
  const count=Number(data.count ?? data.value);
  if(!Number.isFinite(count)) throw Error();
  counter.textContent=(1999+count).toLocaleString("en-US");
 }catch{
  counter.textContent="2000";
 }
})();
